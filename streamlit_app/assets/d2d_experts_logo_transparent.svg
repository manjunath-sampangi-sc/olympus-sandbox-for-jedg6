<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Transparent background - no background element -->
  
  <!-- House icon with arrow -->
  <g transform="translate(200, 80)">
    <!-- House roof -->
    <path d="M-60 20 L0 -40 L60 20 Z" fill="#9a262c" stroke="none"/>
    
    <!-- Chimney -->
    <rect x="30" y="-20" width="15" height="25" fill="#9a262c"/>
    
    <!-- House body -->
    <rect x="-50" y="20" width="100" height="60" fill="none" stroke="#9a262c" stroke-width="8"/>
    
    <!-- Arrow through house -->
    <g>
      <!-- Arrow shaft -->
      <rect x="-70" y="45" width="140" height="10" fill="#9a262c"/>
      
      <!-- Arrow head -->
      <path d="M70 35 L90 50 L70 65 Z" fill="#9a262c"/>
      
      <!-- Arrow tail -->
      <path d="M-70 35 L-90 50 L-70 65 Z" fill="#9a262c"/>
    </g>
  </g>
  
  <!-- Company name -->
  <text x="200" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#9a262c">D2DEXPERTS</text>
  
  <!-- Tagline or subtitle -->
  <text x="200" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">Door-to-Door Sales Excellence</text>
</svg>